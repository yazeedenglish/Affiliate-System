<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F6F2">

    <title>تسجيل الدخول | Yazeed English</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header class="top">
        <a class="brand" href="/">
            <img
                src="https://file.yazeedenglish.com/logo.png"
                alt="Yazeed English"
                class="brand-logo"
            >
            <span>
                Yazeed English
                <small>برنامج الشركاء</small>
            </span>
        </a>

        <div class="header-actions">
            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="تفعيل الوضع الداكن"
                title="تغيير المظهر"
            >
                <span id="themeIcon" aria-hidden="true">🌙</span>
            </button>
        </div>
    </header>

    <main class="login-layout">

        <!-- INTRODUCTION ABOVE LOGIN -->
        <section class="login-intro">
            
        </section>

        <!-- LOGIN CARD -->
        <section class="login-card">

            <div class="login-card-header">
                <h2>تسجيل الدخول</h2>
                <p>أدخل بيانات حسابك للوصول إلى لوحة الشريك</p>
            </div>

            <form id="loginForm" class="login-form">

                <label>
                    رمز الشريك

                    <input
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="أدخل رمز الشريك"
                        required
                    >
                </label>

                <label>
                    كلمة المرور

                    <input
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                </label>

                <button class="btn" type="submit">
                    تسجيل الدخول
                </button>

            </form>

            <p
                id="message"
                class="login-message"
                aria-live="polite"
            ></p>

            <div class="login-note">
                <span class="login-note-icon" aria-hidden="true">ℹ️</span>
                <span>
                    هذه نسخة تجريبية من البرنامج.
                    لا تستخدمها لإدارة حسابات أو أموال حقيقية.
                </span>
            </div>

        </section>
    </main>

    <footer class="site-footer login-footer">
        <nav class="footer-links" aria-label="روابط أساسية">
            <a
                href="https://wa.me/966552087385"
                target="_blank"
                rel="noopener noreferrer"
            >
                دعم الشركاء
            </a>

            <a href="/faq">الأسئلة الشائعة</a>
            <a href="/policy">سياسة البرنامج</a>
        </nav>

        <p class="footer-copyright">
            جميع الحقوق محفوظة © Yazeed English
        </p>
    </footer>

    <script src="../js/app.js"></script>

</body>
</html>
