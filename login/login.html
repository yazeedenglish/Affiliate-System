<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F6F2">

    <title>تسجيل الدخول | Yazeed English</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           PROFESSIONAL LOGIN PAGE
        ========================= */

        .login-layout {
            width: min(100% - 32px, 460px);
            margin: 52px auto 72px;
        }

        .login-intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 14px;
            padding: 7px 13px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 700;
        }

        .login-eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--course-button, #00689b);
        }

        .login-intro h1 {
            margin: 0;
            color: var(--ink);
            font-size: clamp(32px, 6vw, 43px);
            font-weight: 900;
            line-height: 1.35;
            letter-spacing: -1px;
        }

        .login-intro h1 span {
            color: var(--course-button, #00689b);
        }

        .login-intro > p:last-child {
            max-width: 340px;
            margin: 14px auto 0;
            color: var(--ink-soft);
            font-size: 16px;
            line-height: 1.9;
        }

        .login-card {
            padding: clamp(24px, 6vw, 36px);
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 16px 45px rgba(0, 39, 58, 0.07);
        }

        .login-card-header {
            margin-bottom: 26px;
        }

        .login-card-header h2 {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 25px;
            font-weight: 800;
        }

        .login-card-header p {
            margin: 0;
            color: var(--ink-soft);
            font-size: 14px;
            line-height: 1.8;
        }

        .login-form {
            display: grid;
            gap: 19px;
        }

        .login-form label {
            display: grid;
            gap: 9px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 700;
        }

        .login-form input {
            box-sizing: border-box;
            width: 100%;
            min-height: 52px;
            padding: 0 15px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            background: var(--paper);
            color: var(--ink);
            font: inherit;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-form input::placeholder {
            color: var(--ink-soft);
            opacity: 0.75;
        }

        .login-form input:focus {
            border-color: var(--course-button, #00689b);
            box-shadow: 0 0 0 3px rgba(0, 104, 155, 0.12);
        }

        .login-form .btn {
            width: 100%;
            min-height: 52px;
            margin-top: 3px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .login-form .btn:hover {
            transform: translateY(-1px);
        }

        .login-form .btn:active {
            transform: translateY(0);
        }

        .login-message {
            margin: 14px 0 0;
            font-size: 14px;
            line-height: 1.8;
            text-align: center;
        }

        .login-note {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 23px;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink-soft);
            font-size: 12px;
            line-height: 1.9;
        }

        .login-note-icon {
            flex-shrink: 0;
        }

        .login-footer {
            margin-top: 34px;
        }

        .login-footer .footer-links {
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px 22px;
        }

        .login-footer .footer-copyright {
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-layout {
                margin-top: 34px;
            }

            .login-intro {
                margin-bottom: 24px;
            }

            .login-card {
                border-radius: 19px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-form input,
            .login-form .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <header class="top">
        <a class="brand" href="/">
            <img
                src="https://file.yazeedenglish.com/logo.png"
                alt="Yazeed English"
                class="brand-logo"
            >
            <span>
                Yazeed English
                <small>برنامج الشركاء</small>
            </span>
        </a>

        <div class="header-actions">
            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="تفعيل الوضع الداكن"
                title="تغيير المظهر"
            >
                <span id="themeIcon" aria-hidden="true">🌙</span>
            </button>
        </div>
    </header>

    <main class="login-layout">

        <!-- INTRODUCTION ABOVE LOGIN -->
        <section class="login-intro">
            
        </section>

        <!-- LOGIN CARD -->
        <section class="login-card">

            <div class="login-card-header">
                <h2>تسجيل الدخول</h2>
                <p>أدخل بيانات حسابك للوصول إلى لوحة الشريك</p>
            </div>

            <form id="loginForm" class="login-form">

                <label>
                    رمز الشريك

                    <input
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="أدخل رمز الشريك"
                        required
                    >
                </label>

                <label>
                    كلمة المرور

                    <input
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                </label>

                <button class="btn" type="submit">
                    تسجيل الدخول
                </button>

            </form>

            <p
                id="message"
                class="login-message"
                aria-live="polite"
            ></p>

            <div class="login-note">
                <span class="login-note-icon" aria-hidden="true">ℹ️</span>
                <span>
                    هذه نسخة تجريبية من البرنامج.
                    لا تستخدمها لإدارة حسابات أو أموال حقيقية.
                </span>
            </div>

        </section>
    </main>

    <footer class="site-footer login-footer">
        <nav class="footer-links" aria-label="روابط أساسية">
            <a
                href="https://wa.me/966552087385"
                target="_blank"
                rel="noopener noreferrer"
            >
                دعم الشركاء
            </a>

            <a href="/faq/">الأسئلة الشائعة</a>
            <a href="/policy/">سياسة البرنامج</a>
        </nav>

        <p class="footer-copyright">
            جميع الحقوق محفوظة © Yazeed English
        </p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
